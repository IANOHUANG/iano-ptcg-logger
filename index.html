["中毒","灼傷","睡眠","麻痺","混亂","解除特殊狀態"].forEach(s=>FIELDS[s]=[pk("poke","對象寶可夢")]);

function startGame(){if(started()&&!confirm("對局已開始，要再記錄一次「對局開始」嗎？"))return;const pp=S.p;S.turn=1;S.p=S.first;add("— 對局開始：第 1 回合（先攻："+N[S.first]+"）—","sys",{start:1,prevP:pp})}
function coinFlip(){let c={caller:S.p,guess:"",res:"",winner:"",choice:""};
 const ch=(g,v,l)=>`<button type="button" class="chip" data-g="${g}" data-v="${v}">${l}</button>`;
 modal(`<h2>🪙 擲硬幣決定先後攻</h2><label class="fl">猜的人</label><div class="fr">${ch("caller","me","我方")}${ch("caller","op","對手")}</div>
 <label class="fl">猜</label><div class="fr">${ch("guess","正","正面")}${ch("guess","反","反面")}</div>
 <label class="fl">結果</label><div class="fr">${ch("res","正","正面")}${ch("res","反","反面")}<button type="button" class="chip" id="rnd" style="background:#fde68a">🎲 隨機擲</button></div>
 <label class="fl">贏家</label><div class="fr">${ch("winner","me","我方")}${ch("winner","op","對手")}</div>
 <label class="fl">贏家選擇</label><div class="fr">${ch("choice","先攻","先攻")}${ch("choice","後攻","後攻")}</div>
 <p id="cSum" style="font-size:18px;font-weight:700"></p>
 <div class="row"><button id="cOk" style="background:#2563eb;color:#fff">記錄</button><button id="mC" style="background:#fee2e2">取消</button></div>`);
 const box=$("ovb"),upd=()=>{
  box.querySelectorAll("[data-g]").forEach(b=>b.classList.toggle("sel",c[b.dataset.g]===b.dataset.v));
  const f=c.winner&&c.choice?(c.choice==="先攻"?c.winner:oth(c.winner)):"";$("cSum").textContent=f?"先攻："+N[f]:"（請選擇贏家與先後攻）";$("cOk").disabled=!f};
 const auto=()=>{if(c.guess&&c.res)c.winner=c.guess===c.res?c.caller:oth(c.caller)};
 box.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{c[b.dataset.g]=b.dataset.v;if(b.dataset.g!=="winner"&&b.dataset.g!=="choice")auto();upd()});
 $("rnd").onclick=()=>{c.res=Math.random()<.5?"正":"反";auto();upd()};$("mC").onclick=closeM;
 $("cOk").onclick=()=>{const f=c.choice==="先攻"?c.winner:oth(c.winner);const t="擲硬幣："+(c.guess?N[c.caller]+"猜"+c.guess+"，":"")+(c.res?"結果"+c.res+"，":"")+N[c.winner]+"贏，選擇"+c.choice+"（先攻："+N[f]+"）";
  const pf=S.first;S.first=f;closeM();add(t,"sys",{coin:{...c,first:f,prevFirst:pf}})};upd()}
render();
</script></body></html>
